name: Build and test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - ariostas/implement_testing ################## Need to change this

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Save user id
        run: echo "USERID=$(id -u)" >> $GITHUB_ENV
      - name: Build Docker image
        run: make install
      - name: Run tests in Docker container
        uses: addnab/docker-run-action@v3
        with:
          image: cytools:uid-${{ env.USERID }}
          shell: bash
          options: >
            -v ${{ github.workspace }}:/home/cytools
            -w /home/cytools
          run: |
            pip install pytest
            pytest -vv
